name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: python -m pip install -e '.[dev]'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Require current generated files
        run: git diff --exit-code -- dash_text_annotate THIRD_PARTY_NOTICES.md
      - run: python -m pytest -m 'not browser'
      - run: npm audit --audit-level=high
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/check_dist.py dist
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
  compatibility:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            dash: '3.0.0'
          - python: '3.13'
            dash: '4.4.1'
          - python: '3.14'
            dash: '4.4.1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist
      - name: Install the built wheel
        run: python -m pip install dist/*.whl 'dash==${{ matrix.dash }}' 'pytest>=8,<10' 'selenium>=4.35,<5'
      - name: Verify installed package outside checkout
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/scripts/check_installed.py"
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
          install-chromedriver: true
      - name: Run regressions against the installed wheel
        # pytest's importlib mode avoids placing the source checkout on sys.path.
        working-directory: ${{ runner.temp }}
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
          PYTHONPATH: ${{ github.workspace }}/tests
        run: python -m pytest "$GITHUB_WORKSPACE/tests/test_browser.py" "$GITHUB_WORKSPACE/tests/test_package.py" "$GITHUB_WORKSPACE/tests/test_validation.py" --import-mode=importlib --run-browser
